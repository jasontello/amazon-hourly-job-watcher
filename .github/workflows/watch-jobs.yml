name: Watch Amazon hourly jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Record current matches without sending notifications"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: amazon-hourly-job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Check Amazon and notify
        id: watcher
        continue-on-error: true
        env:
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BASELINE_ARG: ${{ github.event.inputs.baseline == 'true' && '--baseline' || '' }}
        shell: bash
        run: |
          if [[ -z "$NTFY_TOPIC" && -z "$BASELINE_ARG" ]]; then
            echo "NTFY_TOPIC is not configured yet; skipping the live check."
            exit 0
          fi
          if [[ -z "$NTFY_SERVER" ]]; then
            export NTFY_SERVER="https://ntfy.sh"
          fi
          python -m amazon_job_watcher $BASELINE_ARG

      - name: Persist notification state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- state/seen_jobs.json; then
            echo "No notification-state changes to persist."
            exit 0
          fi
          git config user.name "amazon-job-watcher[bot]"
          git config user.email "amazon-job-watcher[bot]@users.noreply.github.com"
          git add state/seen_jobs.json
          git commit -m "chore: update seen Amazon job schedules [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Propagate watcher failure
        if: steps.watcher.outcome == 'failure'
        run: exit 1

